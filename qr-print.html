<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Yo's Munchies - scan for updates</title>
<style>
  @page { margin: 12mm; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    margin: 0; padding: 24px; color: #101617; text-align: center;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 90vh;
  }
  .card { border: 2px solid #075E54; border-radius: 20px; padding: 34px 30px; max-width: 420px; width: 100%; }
  h1 { font-size: 25px; margin: 0 0 6px; letter-spacing: -.4px; }
  .sub { color: #5d6b6b; font-size: 15px; margin: 0 0 22px; }
  img { width: 100%; max-width: 300px; height: auto; display: block; margin: 0 auto; }
  .cta { margin: 22px 0 0; font-size: 18px; font-weight: 700; color: #075E54; }
  .hint { margin: 8px 0 0; font-size: 12.5px; color: #93a3a2; word-break: break-all; }
  @media print { body { min-height: auto; } }
</style>
</head>
<body>
  <div class="card">
    <h1>Yo's Munchies</h1>
    <p class="sub">Add your name in one tap - no app, no forms</p>
    <img src="qr.png" alt="QR code - scan to open our WhatsApp sign-up">
    <p class="cta">Scan to get our updates</p>
    <p class="hint">https://lakewoodphone.github.io/yos-munchies/</p>
  </div>
</body>
</html>
