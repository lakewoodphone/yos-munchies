<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sign up for our WhatsApp updates</title>
<meta name="description" content="Tap a message, add your name, send. That's it.">
<meta name="theme-color" content="#075E54">
<!-- A page is unpolished without a tab icon, and the 404 shows in the console. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%2325D366'/%3E%3Cpath d='M16 7a5 5 0 0 0-5 5c0 2 1 3 1 4h8c0-1 1-2 1-4a5 5 0 0 0-5-5zm-3 11h6v2h-6z' fill='%23fff'/%3E%3C/svg%3E">
<!--
  ==========================================================================
  EDIT ONLY THE CONFIG BLOCK BELOW (or better: run setup.py with your details).
  ==========================================================================

  HOW THIS WORKS
  Each button is a "click to chat" link: https://wa.me/<number>?text=<message>
  Tapping it opens WhatsApp with that message already typed but NOT sent.
  The visitor replaces ___ with their name and taps send.

  HOW IT SHOULD READ
  This is a business card with one action, not a set of instructions. Keep the
  page short: who we are, one tap, and the "save our number" step. If you find
  yourself adding a heading that explains the page, delete it instead.
-->
<script>
  window.CONFIG = {
    businessName: "Yo's Munchies",
    tagline: "Get our updates on WhatsApp",
    phoneE164: "17327017757",
    templates: [
      { label: "Add me to your updates", text: "Hi! My name is ___ — please add me to your WhatsApp updates." },
      { label: "I'd like to order", text: "Hi! My name is ___ — I'd like to order." },
      { label: "I have a question", text: "Hi! My name is ___ — I have a question:" },
      { label: "Write my own", text: "Hi! My name is ___ —" }
    ],
    showSaveContact: true,
    vcfFile: "contact.vcf",
    vcfLabel: "Save our number"
  };
</script>
<style>
  :root{
    --wa-dark:#075E54; --wa:#25D366; --wa-deep:#128C7E;
    --ink:#101617; --muted:#5d6b6b; --line:#e6ebe9; --card:#fff; --bg:#f4f6f5;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.45;
    padding:26px 18px calc(26px + env(safe-area-inset-bottom));
    max-width:480px; margin:0 auto;
  }
  header{text-align:center;margin:6px 0 22px}
  .avatar{
    width:82px;height:82px;border-radius:50%;margin:0 auto 14px;
    background:linear-gradient(145deg,var(--wa),var(--wa-deep));
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-size:32px;font-weight:700;
    box-shadow:0 8px 24px rgba(7,94,84,.20);
  }
  h1{font-size:24px;line-height:1.2;margin:0 0 5px;letter-spacing:-.5px}
  .tagline{color:var(--muted);font-size:15px;margin:0}

  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;
        padding:14px;margin-bottom:12px}
  .card h2{font-size:14px;margin:0 0 10px;letter-spacing:.01em;color:var(--muted);
           font-weight:600;text-transform:none}

  .tmpl{
    display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;
    padding:16px 16px;margin-bottom:9px;font:inherit;font-size:16px;font-weight:600;
    text-align:left;text-decoration:none;color:#04352c;background:var(--wa);
    border:0;border-radius:14px;cursor:pointer;
    transition:transform .08s ease;
    box-shadow:0 2px 10px rgba(37,211,102,.25);
  }
  .tmpl:last-of-type{margin-bottom:0}
  .tmpl:active{transform:scale(.985)}
  .tmpl .arrow{opacity:.5;font-size:20px;line-height:1}
  /* One primary action, the rest secondary. Four solid blocks is a wall, not a
     page: a visitor should see the thing to tap first and the alternatives after. */
  .tmpl.outline{background:#fff;color:var(--wa-dark);border:1.5px solid var(--line);
                box-shadow:none;font-weight:600}
  .tmpl.outline .arrow{opacity:.35}

  .hint{color:var(--muted);font-size:13.5px;margin:11px 2px 0}

  .save{background:#fff;border:1.5px solid var(--wa-dark);border-radius:18px;
        padding:15px;margin-bottom:12px;display:flex;align-items:center;
        justify-content:space-between;gap:12px;text-decoration:none;color:var(--wa-dark)}
  .save .t{display:block;font-size:15.5px;font-weight:700}
  .save .s{display:block;font-size:13px;color:var(--muted);font-weight:400;margin-top:3px}
  .save .arrow{font-size:20px;opacity:.6}

  footer{text-align:center;color:var(--muted);font-size:12.5px;margin-top:16px}
</style>
</head>
<body>

<header>
  <div class="avatar" id="avatar">?</div>
  <h1 id="bizName">Business</h1>
  <p class="tagline" id="tagline"></p>
</header>

<div class="card">
  <h2>Message us</h2>
  <div id="templates"></div>
  <p class="hint" id="pickHint">Tapping opens WhatsApp with the message ready. Add your name and hit send.</p>
</div>

<a class="save" id="saveBtn" href="contact.vcf" download>
  <span>
    <span class="t">Save our number</span>
    <span class="s">So our updates show up for you in WhatsApp.</span>
  </span>
  <span class="arrow">↓</span>
</a>

<footer><span id="footBiz"></span></footer>

<script>
(function () {
  var C = window.CONFIG || {};
  var $ = function (id) { return document.getElementById(id); };
  var PLACEHOLDER = /^1?0{9,11}$/;

  var name = (C.businessName || "Business").trim();
  document.title = "Sign up for " + name + " WhatsApp updates";
  $("bizName").textContent = name;
  $("avatar").textContent = name.charAt(0).toUpperCase();
  $("tagline").textContent = C.tagline || "";
  $("footBiz").textContent = name;

  var waNumber = (C.phoneE164 || "").replace(/\D/g, "");
  var configured = !!waNumber && !PLACEHOLDER.test(waNumber);

  function waHref(text) {
    return "https://wa.me/" + waNumber + (text ? "?text=" + encodeURIComponent(text) : "");
  }

  var wrap = $("templates");
  var templates = C.templates || [];

  if (!configured) {
    var warn = document.createElement("p");
    warn.className = "hint";
    warn.innerHTML = "<strong>Setup needed:</strong> put the WhatsApp number in " +
      "<code>CONFIG.phoneE164</code> (or run <code>python setup.py</code>) and these buttons go live.";
    wrap.appendChild(warn);
  } else {
    templates.forEach(function (t, i) {
      var a = document.createElement("a");
      a.className = "tmpl" + (i === 0 ? "" : " outline");
      a.href = waHref(t.text || "");
      a.rel = "noopener";
      var span = document.createElement("span");
      span.className = "txt";
      span.textContent = t.label || ("Message " + (i + 1));
      var arrow = document.createElement("span");
      arrow.className = "arrow";
      arrow.textContent = "\u203A";
      a.appendChild(span);
      a.appendChild(arrow);
      wrap.appendChild(a);
    });
  }

  // The "save our number" step is always visible. It was briefly toggled to
  // appear only after a message was tapped, which did not work: `.save` sets
  // `display:flex`, and that beats the browser's `[hidden]{display:none}`, so the
  // attribute did nothing while looking like it did. It is the only step that
  // makes the updates visible at all, so showing it unconditionally is both
  // simpler and more honest.
  if (C.showSaveContact && C.vcfFile) {
    $("saveBtn").href = C.vcfFile;
    if (C.vcfLabel) { $("saveBtn").querySelector(".t").textContent = C.vcfLabel; }
  }
})();
</script>
</body>
</html>
